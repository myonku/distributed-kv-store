# 样例配置（settings.toml）
# 相对路径（如 storage.path / logger.dir）均以 settings.toml 所在目录为基准解析。

## 运行模式："standalone" | "raft" | "chash_gossip"
mode = "raft"

## 本节点配置（ClusterNode）
[self]
id = "node1"

# 对外 HTTP 地址（Gin HTTP Server 监听地址）
client_address = "127.0.0.1:8080"

# 以下 3 个地址分别给 Raft Node / Gossip Node / Chash Node 间通信使用
raft_grpc_address = "127.0.0.1:9001"
gossip_grpc_address = "127.0.0.1:9101"
chash_grpc_address = "127.0.0.1:9201"

# 只在 chash-gossip 模式下使用，表示环节点权重
weight = 1

## 集群成员管理配置，仅在非 standalone 模式下使用
[membership]
type = "static" # "static" | "raft" | "chash_gossip"

# 静态成员列表示例（至少包含 self；raft/grpc 相关地址按运行模式使用）
[[membership.peers]]
id = "node1"
client_address = "127.0.0.1:8080"
raft_grpc_address = "127.0.0.1:9001"
gossip_grpc_address = "127.0.0.1:9101"
chash_grpc_address = "127.0.0.1:9201"
weight = 1

[[membership.peers]]
id = "node2"
client_address = "127.0.0.1:8081"
raft_grpc_address = "127.0.0.1:9002"
gossip_grpc_address = "127.0.0.1:9102"
chash_grpc_address = "127.0.0.1:9202"
weight = 1

[[membership.peers]]
id = "node3"
client_address = "127.0.0.1:8082"
raft_grpc_address = "127.0.0.1:9003"
gossip_grpc_address = "127.0.0.1:9103"
chash_grpc_address = "127.0.0.1:9203"
weight = 1

## Raft 模式集群配置
[raft]
election_timeout_ms = 1500
heartbeat_interval_ms = 300

## Gossip 协议配置（chash_gossip 模式使用）
[gossip_config]
probe_interval_ms = 500
probe_timeout_ms = 200
gossip_interval_ms = 500
fanout = 3
suspect_timeout_ms = 3000
dead_timeout_ms = 8000

## 一致性哈希配置（chash_gossip 模式使用）
[chash]
virtual_nodes = 64
replication_factor = 3

## 底层存储配置
[storage]
mode = "sqlite" # "memory" | "sqlite"；留空时由程序推断

# sqlite 下：path 可以是“目录”或“具体 db 文件路径”。
# - 为空（或不写）时：默认将 db 放在 settings.toml 同级目录。
# - 例：path = "./data/node1"   => 最终为 ./data/node1/data.db
# - 例：path = "./data/node1/data.sqlite" => 直接使用该文件
path = ""

# 当 path 是目录或为空时使用的默认文件名
sqlite_file = "data.db"

## 日志配置（可选）
[logger]
enabled = true
dir = "logs"      # 相对于 settings.toml 所在目录
extension = "log" # "log" 或 "txt"
prefix = ""       # 文件前缀；为空（默认）则文件名为 YYYY-MM-DD.log
level = "info"    # debug | info | warn | error
stdout = true     # 是否同时输出到控制台
time_format = ""  # Go time layout，留空使用 RFC3339（如 2024-06-12 15:04:05Z07:00）
